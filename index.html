<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Chart Gallery</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #111;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-tap-highlight-color: transparent; /* Disable tap highlight on mobile */
      }

      #gallery-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        position: relative;
      }

      #gallery-image {
        max-width: 95vw;
        max-height: 90vh;
        object-fit: contain;
        transition: opacity 0.3s ease-in-out;
      }

      .nav-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background-color: rgba(0, 0, 0, 0.5);
        color: white;
        border: none;
        padding: 15px;
        cursor: pointer;
        font-size: 24px;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: background-color 0.2s;
        z-index: 10;
      }

      .nav-btn:hover {
        background-color: rgba(0, 0, 0, 0.8);
      }

      #prev-btn {
        left: 20px;
      }

      #next-btn {
        right: 20px;
      }

      #controls {
        position: absolute;
        bottom: 20px;
        left: 47%;
        transform: translateX(-50%);
        background-color: rgba(0, 0, 0, 0.7);
        padding: 10px 20px;
        border-radius: 20px;
        display: flex;
        gap: 15px;
        z-index: 10;
        justify-content: center;
      }

      .control-btn {
        background: #333;
        color: white;
        border: 1px solid #555;
        padding: 10px 20px;
        cursor: pointer;
        border-radius: 15px;
        font-size: 0.6rem;
        transition: background-color 0.2s, transform 0.1s;
      }

      .control-btn:hover {
        background-color: #555;
      }

      .control-btn:active {
        transform: scale(0.95);
      }

      #image-counter {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background-color: rgba(0, 0, 0, 0.7);
        padding: 5px 15px;
        border-radius: 10px;
        font-size: 16px;
        z-index: 10;
      }

      #toast {
        visibility: hidden;
        min-width: 200px;
        background-color: #333;
        color: #fff;
        text-align: center;
        border-radius: 15px;
        padding: 16px;
        position: fixed;
        z-index: 20;
        left: 50%;
        bottom: 90px;
        transform: translateX(-50%);
        font-size: 16px;
      }

      #toast.show {
        visibility: visible;
        -webkit-animation: fadein 0.5s, fadeout 0.5s 2.5s;
        animation: fadein 0.5s, fadeout 0.5s 2.5s;
      }

      /* Responsive Design for Mobile and Tablets */
      @media (max-width: 768px) {
        #gallery-image {
          max-height: 85vh; /* More space for controls */
        }

        .nav-btn {
          width: 40px;
          height: 40px;
          font-size: 20px;
          padding: 10px;
        }

        #prev-btn {
          left: 5px;
        }

        #next-btn {
          right: 5px;
        }

        #controls {
          flex-wrap: wrap; /* Allow buttons to wrap */
          gap: 10px;
          bottom: 10px;
          width: 90%;
        }

        .control-btn {
          font-size: 14px;
          padding: 8px 15px;
        }

        #image-counter {
          font-size: 14px;
          padding: 4px 10px;
          top: 10px;
        }

        #toast {
          bottom: 150px; /* Raise toast above wrapped controls */
          width: 80%;
        }
      }

      @-webkit-keyframes fadein {
        from {
          bottom: 0;
          opacity: 0;
        }
        to {
          bottom: 90px;
          opacity: 1;
        }
      }

      @keyframes fadein {
        from {
          bottom: 0;
          opacity: 0;
        }
        to {
          bottom: 90px;
          opacity: 1;
        }
      }

      @-webkit-keyframes fadeout {
        from {
          bottom: 90px;
          opacity: 1;
        }
        to {
          bottom: 0;
          opacity: 0;
        }
      }

      @keyframes fadeout {
        from {
          bottom: 90px;
          opacity: 1;
        }
        to {
          bottom: 0;
          opacity: 0;
        }
      }

      @media (max-width: 768px) {
        @-webkit-keyframes fadein {
          from {
            bottom: 0;
            opacity: 0;
          }
          to {
            bottom: 150px;
            opacity: 1;
          }
        }

        @keyframes fadein {
          from {
            bottom: 0;
            opacity: 0;
          }
          to {
            bottom: 150px;
            opacity: 1;
          }
        }

        @-webkit-keyframes fadeout {
          from {
            bottom: 150px;
            opacity: 1;
          }
          to {
            bottom: 0;
            opacity: 0;
          }
        }

        @keyframes fadeout {
          from {
            bottom: 150px;
            opacity: 1;
          }
          to {
            bottom: 0;
            opacity: 0;
          }
        }
      }
    </style>
  </head>

          galleryImage.alt = imagePaths[index];
          galleryImage.style.opacity = 1;
          imageCounter.textContent = `${index + 1} / ${imagePaths.length}`;
        }, 300);
      }

      function nextImage() {
        currentIndex = (currentIndex + 1) % imagePaths.length;
        showImage(currentIndex);
      }

      function prevImage() {
        currentIndex = (currentIndex - 1 + imagePaths.length) % imagePaths.length;
        showImage(currentIndex);
      }

      function startSlideshow(startFrom = -1) {
        if (slideshowInterval) return; // Already running

        if (startFrom >= 0 && startFrom < imagePaths.length) {
          currentIndex = startFrom;
          showImage(currentIndex);
        }

        const intervalValue = parseInt(slideshowIntervalInput.value, 10);
        const interval = !isNaN(intervalValue) && intervalValue > 0 ? intervalValue * 1000 : 4000;

        showToast('Slideshow started');
        slideshowInterval = setInterval(() => {
          if (currentIndex >= imagePaths.length - 1) {
            stopSlideshow();
          } else {
            nextImage();
          }
        }, interval);
      }

      function stopSlideshow() {
        if (!slideshowInterval) return;
        clearInterval(slideshowInterval);
        slideshowInterval = null;
        showToast('Slideshow stopped');
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
      }

      const slideshowStartIndexInput = document.getElementById('slideshow-start-index');
      const slideshowIntervalInput = document.getElementById('slideshow-interval');

      // Event Listeners
      nextBtn.addEventListener('click', nextImage);
      prevBtn.addEventListener('click', prevImage);
      slideshowStartBtn.addEventListener('click', () => {
        const startIndex = parseInt(slideshowStartIndexInput.value, 10) - 1;
        if (!isNaN(startIndex) && startIndex >= 0 && startIndex < imagePaths.length) {
          startSlideshow(startIndex);
        } else {
          startSlideshow(currentIndex);
        }
      });
      slideshowStopBtn.addEventListener('click', stopSlideshow);
      fullscreenBtn.addEventListener('click', toggleFullscreen);

      document.getElementById('chart').addEventListener('click', function () {
        const symbol = stockList[currentIndex];
        if (symbol) {
          window.open(`https://www.screener.in/company/${symbol}/consolidated/#chart`, '_blank', 'width=1500,height=650');
        }
      });

      document.getElementById('profit-loss').addEventListener('click', function () {
        const symbol = stockList[currentIndex];
        if (symbol) {
          window.open(`https://www.screener.in/company/${symbol}/consolidated/#profit-loss`, '_blank', 'width=1500,height=650');
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.target.tagName.toLowerCase() === 'input') {
          return;
        }
        if (e.key === 'ArrowRight') {
          nextImage();
        } else if (e.key === 'ArrowLeft') {
          prevImage();
        } else if (e.key === ' ') {
          e.preventDefault();
          if (slideshowInterval) {
            stopSlideshow();
          } else {
            startSlideshow(currentIndex);
          }
        }
      });

      function initialLoadStockList() {
        if (!stockList.length) {
          fetch('screenshots/stocklist.json')
            .then((response) => response.json())
            .then((data) => {
              stockList = data;
            })
            .catch((error) => console.error('Error loading JSON:', error));
        }
      }

      // Initial Load
      showImage(currentIndex);
      initialLoadStockList();
    </script>
  </body>
</html>
